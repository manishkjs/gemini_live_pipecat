name: Application Tests & Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Unit & Route Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install system audio dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest httpx

      - name: Run server unit tests
        working-directory: server
        run: python -m pytest -q tests/

      - name: Run server route & security contract tests
        working-directory: server
        run: python test_routes.py

  frontend-tests:
    name: Voice Studio & Client Tests + Build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install & test Voice Studio
        working-directory: demos/voice-studio
        run: |
          npm ci
          npm test
          npm run build

      - name: Install & build Classic Client
        working-directory: client
        run: |
          npm ci
          npm run build
