      <rect x="830" y="16" width="170" height="26" rx="5" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1"/>
      <text x="915" y="34" fill="#FCA5A5" font-size="12" font-family="'Roboto Mono', 'SF Mono', Consolas, 'Courier New', monospace" text-anchor="middle">2,200ms – 3,000ms</text>

