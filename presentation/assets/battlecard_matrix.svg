      <rect x="1070" y="16" width="160" height="26" rx="5" fill="#EA580C" fill-opacity="0.2" stroke="#EA580C" stroke-width="1"/>
      <text x="1150" y="34" fill="#FED7AA" font-size="12" font-family="'Roboto Mono', 'SF Mono', Consolas, 'Courier New', monospace" text-anchor="middle">1,200ms – 1,800ms</text>
